# Publica o app no GitHub Pages a cada push na main.
#
# O app é só arquivos estáticos; os dados vivem no Firestore da AA Montagens,
# protegidos por firestore.rules (publicadas à mão, não daqui — ver docs/nuvem.md).
# Ver docs/publicar.md.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fontes para public/fontes
        run: npm run fontes:copiar

      - name: Conferir
        run: |
          npm run typecheck
          npx eslint .
          npx vitest run

      - name: Build no subcaminho do Pages
        # https://<usuario>.github.io/<repo>/ — a base é o nome do repositório
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Fallback de rota
        # O Pages não tem regra de rewrite. Para /clientes ou /orcamentos/123
        # não darem 404 ao recarregar, o 404.html é o próprio app: o servidor
        # devolve 404, o navegador carrega o app, e o router assume a rota.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  emulador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Contrato e regras no emulador do Firebase
        run: npm run test:emulador

  publicar:
    needs: [construir, emulador]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
